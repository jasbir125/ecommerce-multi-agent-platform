global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Spring Boot services: Micrometer via Actuator
  - job_name: spring-boot-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - order-service:8081
          - shipment-service:8082
          - payment-service:8083
          - inventory-service:8084
          - approval-service:8085
          - policy-service:8086
          - audit-service:8087
          - workflow-service:8088
          - notification-service:8089

  # Python services: agent host (agents, models, tools, RAG) and the two MCP servers
  - job_name: agent-host
    static_configs: [{ targets: ["agent-host:8092"] }]
  - job_name: mcp-servers
    static_configs: [{ targets: ["ecommerce-mcp-server:8090", "policy-mcp-server:8091"] }]

  # Metrics the OTel collector re-exposes from OTLP
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8889"] }]
