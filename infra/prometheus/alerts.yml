groups:
  - name: availability
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} is down"
          description: "Prometheus cannot scrape {{ $labels.job }}/{{ $labels.instance }} for 2 minutes."
      - alert: HighServerErrorRate
        expr: sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / sum by (application) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }}: more than 5% of requests fail with 5xx"
      - alert: OutboxBacklog
        expr: max by (application) (outbox_pending) > 50
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }} has {{ $value }} events waiting to reach Kafka"
          description: "Kafka may be unavailable, or the outbox relay is stuck. Business events are delayed."

  - name: workflows
    rules:
      - alert: WorkflowFailureRateHigh
        expr: sum(increase(agent_workflow_runs_total{status=~"FAILED|PARTIALLY_COMPLETED"}[30m])) / clamp_min(sum(increase(agent_workflow_runs_total[30m])), 1) > 0.2
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "More than 20% of recovery workflows end failed or partially completed"
      - alert: ApprovalsWaitingTooLong
        expr: histogram_quantile(0.95, sum by (le) (rate(agent_approval_wait_seconds_bucket[1h]))) > 900
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Approvals are taking more than 15 minutes (p95): customers are waiting"
      - alert: ApprovalsPilingUp
        expr: agent_workflows_waiting_for_approval > 10
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} workflows are waiting for a manager"
      - alert: CompensationHappening
        expr: sum(increase(workflow_transitions_total{status="COMPENSATING"}[15m])) > 0
        labels: { severity: warning }
        annotations:
          summary: "A recovery needed compensation (reserved stock released after a failed replacement)"

  - name: agents
    rules:
      - alert: ModelErrorsOrSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(agent_llm_latency_seconds_bucket[10m]))) > 20
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Model calls are slow (p95 above 20 s)"
      - alert: ToolCallFailures
        expr: sum(rate(agent_tool_calls_total{result="error"}[10m])) / clamp_min(sum(rate(agent_tool_calls_total[10m])), 0.001) > 0.2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "More than 20% of tool calls fail"
      - alert: GuardrailRejectionSpike
        expr: sum(increase(agent_guardrail_rejections_total{layer=~"input|output"}[15m])) > 20
        labels: { severity: warning }
        annotations:
          summary: "Guardrails rejected {{ $value }} inputs or outputs in 15 minutes (possible attack or a model regression)"
      - alert: TokenBudgetExceeded
        expr: increase(agent_token_budget_exceeded_total[30m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "A run was stopped by the per-run token budget (possible loop)"
      - alert: LLMCostHigh
        expr: sum(increase(agent_llm_cost_usd_total[1h])) > 5
        labels: { severity: warning }
        annotations:
          summary: "Model spend is above $5 in the last hour"

  - name: rag
    rules:
      - alert: RagAbstentionSpike
        expr: sum(increase(rag_answers_total{outcome="insufficient"}[30m])) / clamp_min(sum(increase(rag_answers_total[30m])), 1) > 0.5
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "More than half of policy questions cannot be answered (policy gap or retrieval problem)"
      - alert: RagHallucinationRateHigh
        expr: sum(increase(rag_validation_total{result="rejected"}[1h])) / clamp_min(sum(increase(rag_validation_total[1h])), 1) > 0.25
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "The grounding check rejects more than 25% of generated answers (model drift?)"
      - alert: RagDegradedRetrieval
        expr: increase(rag_degraded_retrievals_total[10m]) > 0 or increase(rag_retrieval_branch_failures_total[10m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "Policy search is running in degraded mode (embedding provider or vector search failing)"
      - alert: RagRetrievalSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(rag_retrieval_latency_seconds_bucket{cache="miss"}[10m]))) > 3
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Uncached policy retrieval p95 is above 3 s"

  - name: security
    rules:
      - alert: AuthFailureSpike
        expr: sum(increase(platform_auth_failures_total[5m])) > 30
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} rejected credentials in 5 minutes across services (probing or a misconfigured client)"
      - alert: LoginBruteForce
        expr: sum(increase(auth_login_total{result=~"failed|throttled"}[10m])) > 20
        labels: { severity: warning }
        annotations:
          summary: "Many failed logins in 10 minutes"
