server:
  port: 8086

spring:
  application:
    name: policy-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${SPRING_DATASOURCE_USERNAME:ecommerce}
    password: ${SPRING_DATASOURCE_PASSWORD:ecommerce_local_pw}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
      connection-timeout: 3000
      # HNSW search breadth (higher = better recall, slower); iterative scan keeps filtered ANN queries from returning too few rows.
      connection-init-sql: "SET hnsw.ef_search = 100; SET hnsw.iterative_scan = relaxed_order"
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 500ms
      connect-timeout: 500ms
  http:
    client:
      connect-timeout: 3s
      read-timeout: 15s
  kafka:
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: recovery-policy-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
  ai:
    model:
      chat: none                       # policy-service only needs embeddings
      embedding: ${POLICY_EMBEDDING_PROVIDER:hash}   # openai | hash (offline, lexical-ish)
    openai:
      api-key: ${OPENAI_API_KEY:not-set}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

platform:
  service-token: ${PLATFORM_SERVICE_TOKEN:${MCP_SERVICE_TOKEN:local-demo-token}}
  security-enabled: true
  faults:
    enabled: ${PLATFORM_FAULTS_ENABLED:false}
  max-body-bytes: 1048576
  env: ${PLATFORM_ENV:dev}
  jwt:
    jwks-url: ${PLATFORM_JWT_JWKS_URL:}
    issuer: ${PLATFORM_JWT_ISSUER:order-recovery-auth}
    audience: ${PLATFORM_JWT_AUDIENCE:order-recovery-api}
  audit-service-url: ${PLATFORM_AUDIT_SERVICE_URL:http://localhost:8087}

policy:
  embedding-provider: ${POLICY_EMBEDDING_PROVIDER:hash}
  embedding:
    batch-size: 64
    cache-ttl-days: 30
  chunking:
    max-tokens: 220
    min-tokens: 60
    overlap-tokens: 45
    semantic: true
  retrieval:
    candidates: 20                 # per branch (vector, keyword)
    max-chunks-per-document: 3
    max-context-tokens: 450        # budget for all returned evidence
    stage-timeout-ms: 4000
    query-timeout-seconds: 3
    min-confidence: 0.35           # below this we answer "insufficient evidence"
    # Part of every cache key. Bump it whenever scoring, chunking or compression logic changes,
    # so a deploy never serves answers computed by the old logic.
    ranking-version: r4
    cache-ttl-seconds: 600
    cache-ttl-insufficient-seconds: 120
  # Optional read replica for retrieval-heavy load: set the URL to route search queries there.
  datasource:
    read:
      url: ${POLICY_READ_DATASOURCE_URL:}
  refund:
    min-delay-days: 3           # delayed this many days or more => eligible
    approval-required-from: 0   # refund amounts >= this need approval (0 = always)
  seed-on-startup: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    redis:
      enabled: false              # a cache outage must not mark the service unhealthy
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        rag.retrieval.latency: true
    tags:
      application: policy-service

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{correlationId:-}]"
