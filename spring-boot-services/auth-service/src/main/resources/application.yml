server:
  port: 8093

spring:
  application:
    name: auth-service
  # Not used by the auth service itself, but the shared common module wires Kafka/JDBC beans.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.JdbcClientAutoConfiguration

      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

platform:
  service-token: ${PLATFORM_SERVICE_TOKEN:${MCP_SERVICE_TOKEN:local-demo-token}}
  security-enabled: true
  audit-service-url: ""
  messaging:
    enabled: false              # the identity service needs neither Postgres nor Kafka
  env: ${PLATFORM_ENV:dev}
  public-paths:
    - /api/auth/token
    - /.well-known/jwks.json

auth:
  issuer: order-recovery-auth
  audience: order-recovery-api
  ttl-minutes: ${AUTH_TOKEN_TTL_MINUTES:15}
  private-key-pem: ${AUTH_PRIVATE_KEY_PEM:}
  # DEMO USERS. Change the passwords or replace this service with a real identity provider before deploying.
  users:
    - { username: alice,  password: "${AUTH_DEMO_PASSWORD:demo-pass}", customer-id: CUST-1001, roles: [CUSTOMER] }
    - { username: bob,    password: "${AUTH_DEMO_PASSWORD:demo-pass}", customer-id: CUST-2002, roles: [CUSTOMER] }
    - { username: olivia, password: "${AUTH_DEMO_PASSWORD:demo-pass}", roles: [OPERATOR] }
    - { username: manny,  password: "${AUTH_DEMO_PASSWORD:demo-pass}", roles: [MANAGER, OPERATOR] }
    - { username: admin,  password: "${AUTH_DEMO_PASSWORD:demo-pass}", roles: [ADMIN, OPERATOR] }

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: auth-service

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{correlationId:-}]"
